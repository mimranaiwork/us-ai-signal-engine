name: AI signal backtest

# Walk-forward trading test of the engine's XGBoost signals on the Shariah
# universe (scripts/run_ai_signal_backtest.py). Manual, or on pushes to the
# backtest branch that change it. Commits the report back.
on:
  workflow_dispatch:
  push:
    branches: [feature/breakout-backtest]
    paths:
      - "backtesting/ai_signal_backtest.py"
      - "scripts/run_ai_signal_backtest.py"
      - ".github/workflows/ai-signal-backtest.yml"

permissions:
  contents: write

concurrency:
  group: ai-signal-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt

      # Model + feature deps only; no torch/mlflow/celery needed for XGBoost walk-forward.
      - run: pip install -r requirements-bot.txt "yfinance>=0.2.40" "scikit-learn>=1.4" "xgboost>=2.0" scipy

      - name: Tests must pass first
        run: |
          python scripts/generate_sample_data.py > /dev/null   # synthetic fixtures the leakage tests read
          python -m pytest tests/test_ai_signal_backtest.py tests/test_indicators.py tests/test_leakage.py -q

      - name: Run AI signal backtest
        run: python scripts/run_ai_signal_backtest.py

      - name: Save report
        if: success()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add backtesting/ai_signal_backtest_report.md backtesting/ai_signal_backtest_report.json
          git diff --cached --quiet || (git commit -m "AI signal backtest report $(date -u +%F)" && git pull --rebase -q && git push)
